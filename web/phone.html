<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone camera</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101a25;color:#edf6ff;font:16px system-ui,sans-serif}main{max-width:920px;margin:auto;padding:14px}h1{margin:0 0 8px;color:#66e3ed;font-size:24px}p{color:#b4c7d9;line-height:1.4;margin:8px 0 14px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,select{font:inherit;background:#223647;color:inherit;border:1px solid #526e80;border-radius:8px;padding:10px}#start{background:#66e3ed;color:#101a25;font-weight:bold}#stop{background:#853749}button:disabled{opacity:.5}label{display:flex;align-items:center;gap:7px}input{width:20px;height:20px;accent-color:#66e3ed}#picture{position:relative;background:#05090e;line-height:0;border:1px solid #294252;border-radius:8px;overflow:hidden;min-height:150px}video{display:block;max-height:65dvh;width:100%;object-fit:contain}canvas{position:absolute;pointer-events:none;inset:0;width:100%;height:100%;object-fit:contain}#status{min-height:42px;line-height:1.4;margin:12px 0;color:#b4c7d9}#detection{margin:8px 0;font-size:14px;color:#65ff92}footer{font-size:13px;color:#b4c7d9;line-height:1.5}a{color:#66e3ed}
</style>
<style>
[hidden]{display:none!important}#filterPanel{padding:10px;margin:12px 0;border:1px solid #294252;border-radius:8px;background:#142330}#filterPanel nav{margin:0}#filterPanel p{margin:8px 0 0;font-size:13px}#toggleFilters[aria-expanded=true]{border-color:#66e3ed;color:#66e3ed}
</style>
<main>
<h1>Phone camera</h1>
<p>Send this phone’s camera to your uConsole. Keep this page open while streaming.</p>
<nav><button id="start">Start camera</button><button id="stop" disabled>Stop</button><select id="facing" aria-label="Camera lens"><option value="environment">Rear camera</option><option value="user">Front camera</option></select></nav>
<nav><label title="Shared across your screens"><input id="boxesToggle" type="checkbox" checked>Detection</label><button id="toggleFilters" type="button" aria-expanded="false" aria-controls="filterPanel">Filters</button></nav>
<section id="filterPanel" aria-label="Box filters for this screen" hidden>
<nav>
<span>Show:</span><label style="color:#65ff92"><input id="showPeople" type="checkbox" checked>People</label>
<label style="color:#ffd54a"><input id="showVehicles" type="checkbox" checked>Vehicles</label>
<label title="Police recognition is not ready; this option is disabled." style="color:#ff8585"><input id="showPolice" type="checkbox" disabled>Possible police <small>· not ready</small></label>
</nav>
<p>Filters apply to this screen. Detection is shared.</p>
</section>
<div id="picture"><video id="preview" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
<div id="status" role="status">Camera is off. Tap Start camera, then allow camera access.</div>
<div id="detection"></div>
<footer>Video only · No recording<br><a href="/">Open the shared camera viewer</a></footer>
</main>
<script src="/common.js"></script>
<script src="/phone.js"></script>
</html>
