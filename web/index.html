<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>uConsole Camera</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101a25;color:#edf6ff;font:15px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}header,.controls,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:21px;color:#66e3ed}.pill{font-size:13px;margin-left:auto;color:#acbfcc}button,select{font:inherit;color:inherit;background:#223647;border:1px solid #526e80;border-radius:7px;padding:6px 9px}button{cursor:pointer}label{display:flex;gap:7px;align-items:center}input[type=checkbox]{width:19px;height:19px;accent-color:#66e3ed}input[type=range]{width:88px;accent-color:#66e3ed}#stage{min-height:80px;flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#05090e;border:1px solid #294252;border-radius:8px;overflow:hidden}#picture{position:relative;line-height:0;max-width:100%;max-height:100%}#video{display:block;width:100%;height:100%}#boxes{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#notice{position:absolute;left:12px;right:12px;bottom:12px;padding:10px;background:#101a25e8;line-height:1.4;border-radius:6px}footer{font-size:13px;min-height:18px;color:#b4c7d9}#performance{margin-left:auto}.hidden{display:none!important}#stage:fullscreen{border:0;border-radius:0}#stage:fullscreen #picture{margin:auto}@media(max-width:580px){main{padding:7px}.controls{gap:8px;font-size:13px}h1{font-size:18px}.pill{font-size:12px}button,select{padding:5px}footer{font-size:12px}}
</style>
<style>
[hidden]{display:none!important}#filterPanel{padding:10px;border:1px solid #294252;border-radius:8px;background:#142330}#filterPanel .controls{gap:10px 16px}#filterPanel p{margin:8px 0 0;font-size:12px;color:#b4c7d9}#toggleFilters[aria-expanded=true]{border-color:#66e3ed;color:#66e3ed}
</style>
<main>
  <header><h1>Camera</h1><span class="pill" id="connection">Connecting…</span><button id="fullscreen">Full screen</button></header>
  <div class="controls">
    <label>Camera <select id="source"><option value="home">ESP32 · Home Wi-Fi</option><option value="field">ESP32 · Hotspot</option><option value="phone">Android phone</option><option value="drone">Drone · Android screen</option><option value="ring_back">Ring · Back</option><option value="ring_side">Ring · Side</option><option value="ring_front">Ring · Front Door</option></select></label>
    <label title="Shared across your screens"><input type="checkbox" id="detect" checked>Detection</label>
    <button id="toggleFilters" type="button" aria-expanded="false" aria-controls="filterPanel">Filters</button>
    <button id="openPhone" hidden>Open phone camera</button>
    <button id="ringLive" hidden>Start live view</button>
  </div>
  <section id="filterPanel" aria-label="Box filters for this screen" hidden>
  <div class="controls">
    <span style="color:#b4c7d9">Show:</span>
    <label style="color:#65ff92"><input type="checkbox" id="showPeople" checked>People</label>
    <label style="color:#ffd54a"><input type="checkbox" id="showVehicles" checked>Vehicles</label>
    <label title="Police recognition is not ready; this option is disabled." style="color:#ff8585"><input type="checkbox" id="showPolice" disabled>Possible police <small style="color:#b4c7d9">· not ready</small></label>
    <label>Confidence <input id="threshold" type="range" min="30" max="85" step="5" value="50"><output id="thresholdValue">50%</output></label>
  </div>
  <p>Filters and Confidence apply to this screen. Camera and Detection are shared.</p>
  </section>
  <div id="stage"><div id="picture"><canvas id="video" width="640" height="480"></canvas><canvas id="boxes" width="640" height="480"></canvas></div><div id="notice">Connecting to camera…</div></div>
  <footer><span id="detection">Connecting to uConsole…</span><span id="performance"></span></footer>
  <div id="droneHelp" hidden style="font-size:12px;color:#b4c7d9">Keep PotensicPro visible on Android. View only, including app buttons and status. Use the phone and controller for flying.</div>
  <div id="ringHelp" hidden style="font-size:12px;color:#b4c7d9"></div>
</main>
<script src="/common.js"></script>
<script src="/app.js"></script>
</html>
